---
# yamllint disable rule:line-length
name: eslint
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  eslint:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: npm install -g eslint@9.39.5
      - run: npm install @eslint/js@9.39.5
      - run: eslint --config .github/eslint.config.js
